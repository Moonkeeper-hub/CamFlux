name: Windows CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build solution
        run: dotnet build CamFlux.slnx -c Release
      - name: Run unit tests
        run: dotnet test CamFlux.slnx -c Release --no-build --logger trx --results-directory TestResults
      - name: Publish self-contained Windows x64
        run: dotnet publish src/CamFlux.App -c Release -r win-x64 --self-contained true -o artifacts/CamFlux-win-x64
      - name: Package portable distribution
        shell: pwsh
        run: |
          if (!(Test-Path artifacts/CamFlux-win-x64/CamFlux.App.exe) -or !(Test-Path artifacts/CamFlux-win-x64/coreclr.dll)) {
            throw 'Expected executable and self-contained runtime missing'
          }
          Compress-Archive -Path artifacts/CamFlux-win-x64/* -DestinationPath artifacts/CamFlux-win-x64.zip
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CamFlux-test-results
          path: TestResults
          if-no-files-found: ignore
      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: CamFlux-win-x64
          path: artifacts/CamFlux-win-x64.zip
